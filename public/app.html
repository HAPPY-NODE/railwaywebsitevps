<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - HAPPY NODE</title>
  <meta name="page-title" content="Dashboard">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="top-left">
      <img src="/logo.svg" alt="" width="16" height="16">
      <span class="brand-sm" id="brandName">HAPPY NODE</span>
      <span class="role-badge" id="roleBadge">Manager</span>
    </div>
    <div class="top-right">
      <div class="theme-group" id="themeGroup">
        <button class="theme-btn" data-theme="light" title="Light"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg></button>
        <button class="theme-btn" data-theme="dark" title="Dark"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.985 12.486a9 9 0 1 1-9.473-9.472c.405-.022.617.46.402.803a6 6 0 0 0 8.268 8.268c.344-.215.825-.004.803.401"></path></svg></button>
        <button class="theme-btn" data-theme="system" title="System"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"></rect><line x1="8" x2="16" y1="21" y2="21"></line><line x1="12" x2="12" y1="17" y2="21"></line></svg></button>
      </div>
      <button class="btn outline xs" id="adminBtn" hidden onclick="location.href='/admin.html'">Admin</button>
      <button class="btn ghost xs" onclick="logout()"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 17 5-5-5-5"></path><path d="M21 12H9"></path><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path></svg>Sign out</button>
    </div>
  </header>

  <main class="page">
    <div class="row-between">
      <div>
        <h1 class="page-title">My VMs</h1>
        <p class="page-sub">Your sandbox virtual machines.</p>
      </div>
      <div class="flex gap-2">
        <button class="btn outline xs" id="refreshBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>Refresh</button>
        <button class="btn primary xs" id="newVmBtn"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19h8"></path><path d="m4 17 6-6-6-6"></path></svg>New VM</button>
      </div>
    </div>

    <div class="banner">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"></path></svg>
      <span id="bannerText">Limit: <b>1</b> VM running at a time. VMs auto-stop after <b><span class="ttlLabel">4</span> hr</b>, freeing your slot for a new one.</span>
    </div>

    <div class="list-card" id="vmList"></div>
    <div class="err" id="err"></div>
  </main>

  <!-- New VM modal panel -->
    <!-- New VM modal -->
  <div class="modal-backdrop" id="vmModal">
    <div class="modal">
      <div class="card-title">New VM</div>
      <div class="card-sub" style="margin-bottom:12px;">Enter a name for your Ubuntu XFCE desktop.</div>
      <input id="vmNameInput" class="input" maxlength="40" autocomplete="off">
      <div class="err" id="vmModalErr" style="margin-top:8px;"></div>
      <div class="flex gap-2" style="margin-top:16px; justify-content:flex-end;">
        <button class="btn ghost xs" id="vmCancelBtn">Cancel</button>
        <button class="btn primary xs" id="vmCreateBtn">Create</button>
      </div>
    </div>
  </div>

  <!-- Live boot log panel -->
  <div class="log-panel" id="vmLogPanel">
    <div class="log-window">
      <div class="log-header">
        <span id="vmLogStatus" class="log-status">BOOTING…</span>
        <span id="vmLogClose" class="log-close">Close</span>
      </div>
      <div class="log-lines" id="vmLogLines"></div>
    </div>
  </div>

  <script src="/site.js"></script>
  <script src="/dashboard.js"></script>
</body>
</html>
