<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desktop Ready — HAPPY NODE</title>
  <meta name="description" content="Your Ubuntu XFCE desktop is ready.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/site.js" defer></script>
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <img src="/logo.svg" alt="" class="brand-logo">
        <span class="brand-name" data-brand>HAPPY NODE</span>
        <span class="badge badge-green">Desktop</span>
      </div>
      <div class="topbar-actions">
        <a href="/app.html" class="btn btn-ghost">← Back to Dashboard</a>
        <button class="btn btn-ghost" id="signout-btn">Sign out</button>
      </div>
    </header>

    <main class="container">
      <div class="card card-center" style="max-width:540px;margin:48px auto;">
        <div class="card-body text-center">
          <div class="success-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
          </div>
          <h1 class="card-title">Desktop is ready!</h1>
          <p class="card-subtitle">Your Ubuntu XFCE desktop is running and ready to use.</p>

          <div class="info-grid">
            <div class="info-item">
              <span class="info-label">VM Name</span>
              <span class="info-value mono" id="vm-name">—</span>
            </div>
            <div class="info-item">
              <span class="info-label">Resolution</span>
              <span class="info-value mono" id="vm-res">1280×720</span>
            </div>
            <div class="info-item">
              <span class="info-label">Expires in</span>
              <span class="info-value mono" id="vm-ttl">4h 0m</span>
            </div>
          </div>

          <a id="open-desktop-btn" href="#" class="btn btn-primary btn-lg" style="width:100%;margin-top:24px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:8px;">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Open Desktop
          </a>

          <p class="hint-text">
            Desktop will auto-stop after the time limit. Your data is saved until then.
          </p>
        </div>
      </div>
    </main>
  </div>

  <script>
    (function () {
      // Check auth
      fetch('/api/me').then(r => r.json()).then(d => {
        if (!d.user) { window.location.href = '/'; return; }
        document.getElementById('signout-btn').addEventListener('click', async () => {
          await fetch('/api/logout', { method: 'POST' });
          window.location.href = '/';
        });
      });

      // Get session info
      fetch('/api/sandbox').then(r => r.json()).then(d => {
        const s = d.session;
        if (!s) { window.location.href = '/app.html'; return; }
        document.getElementById('vm-name').textContent = s.name || 'desktop';
        document.getElementById('vm-res').textContent = (s.width || 1280) + '×' + (s.height || 720);
        const ttlMin = d.ttlHours * 60;
        const h = Math.floor(ttlMin / 60);
        const m = Math.floor(ttlMin % 60);
        document.getElementById('vm-ttl').textContent = h + 'h ' + m + 'm';
        // Set the desktop link
        document.getElementById('open-desktop-btn').href = '/vnc/' + s.username;
      });
    })();
  </script>
</body>
</html>
